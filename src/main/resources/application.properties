server.port=0

# ---- 本地对象存储可配置项（com.github.lisama569.objectstoreversioningjava.config.ObjectStoreProperties）----
# 本地数据根目录（blobs/ 正常区、tmp/ 暂存区、quarantine/ 隔离区）
object-store.data-dir=${java.io.tmpdir}/object-store-versioning
# 每个 key 最多保留的版本数（含删除标记）；0 或负数表示不限制
object-store.max-versions-per-key=0
# 是否在每次写入/删除裁剪后自动物理回收无引用 blob；false 时需手动调用 purge
object-store.auto-purge=false
# 保留规则守卫：每 key 至少保留版本数下限（per-key 规则不得更低，必须 >=1）
object-store.retention-min-versions=1
# 保留规则守卫：版本最短保留时长下限（毫秒），per-key 规则不得更短
object-store.retention-min-retention-millis=0
# 自动回收阈值：blobs 区占用字节上限；0 表示不按容量触发
object-store.reclaim-max-disk-bytes=0
# 自动回收阈值：数据目录所在卷占用比例上限 (0,1]；0 表示不按比例触发
object-store.reclaim-max-usage-ratio=0
